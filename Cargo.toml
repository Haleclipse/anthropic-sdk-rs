[workspace]
members = [".", "packages/bedrock-sdk", "packages/vertex-sdk", "packages/foundry-sdk"]
resolver = "2"

[package]
name = "anthropic-sdk"
version = "0.74.0"
edition = "2024"
rust-version = "1.85"
description = "Unofficial Rust client for the Anthropic API, aligned with @anthropic-ai/sdk v0.74.0"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Haleclipse/anthropic-sdk-rs"
homepage = "https://github.com/Haleclipse/anthropic-sdk-rs"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
# TLS backend is target-specific (see below). Shared features only.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
futures = "0.3"
thiserror = "2"
bytes = "1"
pin-project-lite = "0.2"
async-trait = "0.1"
tracing = "0.1"
url = "2"
http = "1"
httpdate = "1"
rand = "0.10"
schemars = "1"

# Android/Termux: OpenSSL (native-tls).
# Desktop: rustls WITHOUT a crypto provider (rustls-no-provider) so the
# binary can install ring (or another provider) once. Avoids Cargo feature
# union pulling BOTH ring and aws-lc-sys when the host app already depends
# on rustls+ring (Cometix: CryptoProvider::install_default in main.rs).
# Without default features reqwest reads the proxy environment variables
# but not the OS proxy settings (`system-proxy`), and speaks HTTP/1.1 only
# (`http2`). As in TS, which leaves both to the runtime's fetch, these are
# the application's call. No crate in this workspace turns reqwest's
# default features on. See README § TLS and proxies.
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "multipart", "native-tls"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "multipart", "rustls-no-provider"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
pretty_assertions = "1"

# Tests and examples do not install a provider, so they build with
# reqwest's own (aws-lc-rs). Dev-dependency features never reach a
# dependent's build.
[target.'cfg(not(target_os = "android"))'.dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

