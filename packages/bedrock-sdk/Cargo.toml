[package]
name = "anthropic-sdk-bedrock"
version = "0.26.3"
edition = "2024"
description = "Amazon Bedrock provider for anthropic-sdk"
license = "MIT"
repository = "https://github.com/Haleclipse/anthropic-sdk-rs"

[dependencies]
anthropic-sdk = { path = "../.." }
# No default features: the TLS backend and proxy sources are the core
# crate's and the application's choice (see the root Cargo.toml).
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
futures = "0.3"
bytes = "1"
pin-project-lite = "0.2"
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
crc32fast = "1"
time = { version = "0.3", features = ["formatting"] }
url = "2"
# No default HTTPS client unless the `default-https-client` feature asks for
# one: aws-config's links aws-lc-rs. An application with its own TLS stack
# turns the feature off and passes `BedrockConfig::sdk_config` with an HTTP
# client of its own.
aws-config = { version = "1.8.16", default-features = false, features = ["rt-tokio", "credentials-process", "sso"] }
aws-credential-types = "1.2.14"

[features]
default = ["default-https-client"]
# aws-config's default HTTPS client, for the credential chain this crate
# loads itself when `BedrockConfig::sdk_config` is `None`.
default-https-client = ["aws-config/default-https-client"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
pretty_assertions = "1"
wiremock = "0.6"

# See the root Cargo.toml: tests build with reqwest's own crypto provider.
[target.'cfg(not(target_os = "android"))'.dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
