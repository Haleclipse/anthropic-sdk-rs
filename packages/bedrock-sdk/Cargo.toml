[package]
name = "anthropic-sdk-bedrock"
version = "0.26.3"
edition = "2024"
description = "Amazon Bedrock provider for anthropic-sdk"
license = "MIT"
repository = "https://github.com/Haleclipse/anthropic-sdk-rs"

[dependencies]
anthropic-sdk = { path = "../.." }
# No default features: the TLS backend and proxy sources are the core
# crate's and the application's choice (see the root Cargo.toml).
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `process`, `time` and `fs` for the credential chain (`credential_process`,
# its timeouts and retry delays, the shared config files).
tokio = { version = "1", features = ["rt", "macros", "sync", "process", "time", "fs"] }
futures = "0.3"
bytes = "1"
pin-project-lite = "0.2"
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
crc32fast = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
url = "2"
# The warnings the credential chain's npm packages print with `console.warn`.
tracing = "0.1"
# The local time zone, for `new Date` on a date-time without an offset.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
pretty_assertions = "1"
wiremock = "0.6"
# Builds responses for the container-credentials parser without a server.
http = "1"

# See the root Cargo.toml: tests build with reqwest's own crypto provider.
[target.'cfg(not(target_os = "android"))'.dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
