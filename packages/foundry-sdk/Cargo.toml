[package]
name = "anthropic-sdk-foundry"
version = "0.2.3"
edition = "2024"
description = "Azure AI Foundry provider for anthropic-sdk"
license = "MIT"
repository = "https://github.com/Haleclipse/anthropic-sdk-rs"

[dependencies]
anthropic-sdk = { path = "../.." }
# No default features: the TLS backend and proxy sources are the core
# crate's and the application's choice (see the root Cargo.toml).
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
futures = "0.3"
# `azure-identity` only.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }
getrandom = { version = "0.3", optional = true }
ryu-js = { version = "1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[features]
# A port of the part of npm `@azure/identity` a Foundry client needs:
# `DefaultAzureCredential` (environment client secret, managed identity, Azure
# CLI) and `getBearerTokenProvider`. The TS foundry-sdk does not depend on it;
# Claude Code does, and hands the result in as `azureADTokenProvider`.
azure-identity = [
    "dep:chrono",
    "dep:getrandom",
    "dep:ryu-js",
    "dep:uuid",
    "tokio/process",
    "tokio/time",
    "tokio/sync",
]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
pretty_assertions = "1"
wiremock = "0.6"

# See the root Cargo.toml: tests build with reqwest's own crypto provider.
[target.'cfg(not(target_os = "android"))'.dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
