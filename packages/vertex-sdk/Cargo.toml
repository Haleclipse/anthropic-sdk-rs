[package]
name = "anthropic-sdk-vertex"
version = "0.14.3"
edition = "2024"
description = "Google Cloud Vertex AI provider for anthropic-sdk"
license = "MIT"
repository = "https://github.com/Haleclipse/anthropic-sdk-rs"

[dependencies]
anthropic-sdk = { path = "../.." }
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
pretty_assertions = "1"
wiremock = "0.6"
